<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parts of a Flower – Click to Reveal</title>
<style>
:root{--bg:#f5f5f2;--fg:#1f1f1d;--muted:#6b6b66;--accent:#2f7d32;--btn:#fff;--bd:#d6d6d0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1b1a;--fg:#ececE8;--muted:#a3a39d;--accent:#7bc67e;--btn:#2a2a28;--bd:#444441}}
:root[data-theme="dark"]{--bg:#1b1b1a;--fg:#ececE8;--muted:#a3a39d;--accent:#7bc67e;--btn:#2a2a28;--bd:#444441}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px 14px}
main{max-width:860px;margin:0 auto}
h1{font-size:1.4rem;margin:0 0 4px}
p.sub{margin:0 0 14px;color:var(--muted);font-size:.95rem}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.count{font-weight:600;color:var(--accent);margin-right:auto}
button.ctl{background:var(--btn);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:8px 14px;font-size:.9rem;cursor:pointer}
button.ctl:hover{border-color:var(--accent)}
.card{background:#fff;border-radius:12px;border:1px solid var(--bd);padding:8px;overflow:hidden}
.stage{position:relative;width:100%;line-height:0}
.stage img{width:100%;height:auto;display:block;user-select:none;-webkit-user-drag:none}
.cover{position:absolute;background:#fff;border:1.5px solid #c9c9c9;border-radius:4px;cursor:pointer;padding:0;
 transition:opacity .45s ease,border-color .2s,background .2s}
.cover:hover{border-color:#2f7d32;background:#f1f8f1}
.cover.open{opacity:0;border-color:transparent}
.cover:focus-visible{outline:2px solid #2f7d32;outline-offset:1px}
</style></head><body><main>

<script>
var REF_W=800, REF_H=438.0;
// [name, x1, y1, x2, y2] in a 800-wide coordinate space
var labels=[
["pollen tube",68,77,166,99],["anther",108,109,166,129],["filament",95,131,166,150],
["stamen",8,130,72,151],["petal",120,170,166,191],["ovule",117,214,166,236],
["receptacle",78,254,166,275],["sepal",118,283,166,304],["pedicel",102,333,166,355],
["stigma",657,46,718,68],["style",657,140,702,162],["ovary",657,210,708,232],["pistil",748,140,793,162]
];
var stage=document.getElementById('stage'),covers=[];
labels.forEach(function(l){
  var b=document.createElement('button');b.className='cover';b.type='button';
  b.setAttribute('aria-label','Hidden label – click to reveal');
  b.style.left=(l[1]/REF_W*100)+'%';b.style.top=(l[2]/REF_H*100)+'%';
  b.style.width=((l[3]-l[1])/REF_W*100)+'%';b.style.height=((l[4]-l[2])/REF_H*100)+'%';
  b.onclick=function(){b.classList.toggle('open');b.setAttribute('aria-label',b.classList.contains('open')?l[0]:'Hidden label – click to reveal');update();};
  stage.appendChild(b);covers.push(b);
});
function update(){var n=covers.filter(function(c){return c.classList.contains('open')}).length;
  document.getElementById('count').textContent=n+' of '+covers.length+' revealed';}
function setAll(v){covers.forEach(function(c,i){c.classList.toggle('open',v);c.setAttribute('aria-label',v?labels[i][0]:'Hidden label – click to reveal');});update();}
document.getElementById('all').onclick=function(){setAll(true)};
document.getElementById('none').onclick=function(){setAll(false)};
update();
</script></body></html>
